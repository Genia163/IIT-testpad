<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-тестирование</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 600px; padding: 0 20px; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .question { margin-bottom: 20px; }
        .options label { display: block; margin: 8px 0; cursor: pointer; }
        button { background: #0066cc; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0052a3; }
        #result { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Тест по дисциплине</h2>
    
    <!-- Скрытый iframe, чтобы страница не перезагружалась при отправке -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted) { alert('Тест успешно отправлен преподавателю!'); }"></iframe>

    <!-- Форма отправляет данные напрямую в Google Таблицу без ошибок CORS -->
    <form id="quizForm" action="https://script.google.com/macros/s/AKfycbx3i2f_YcjAeJQR0DHlWVGYzZjX7DPQCw1lh-olQtjbmORN6lrxBZ1n3-WepIJuWog5ug/exec" method="GET" target="hidden_iframe" onsubmit="prepareSubmit(event)">
        
        <div id="userInfo">
            <label>ФИО студента:<br><input type="text" name="name" id="studentName" required style="width: 100%; padding: 8px; margin: 10px 0;"></label>
            <label>Группа:<br><input type="text" name="group" id="studentGroup" required style="width: 100%; padding: 8px; margin: 10px 0;"></label>
        </div>

        <div class="question">
            <p><b>1. Какой язык программирования используется для веб-разработки на клиенте?</b></p>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> C++</label>
                <label><input type="radio" name="q1" value="B" required> JavaScript</label>
                <label><input type="radio" name="q1" value="C"> Python</label>
            </div>
        </div>

        <div class="question">
            <p><b>2. Что обозначает аббревиатура HTML?</b></p>
            <div class="options">
                <label><input type="radio" name="q2" value="A" required> HyperText Markup Language</label>
                <label><input type="radio" name="q2" value="B"> High Tech Modern Language</label>
            </div>
        </div>

        <!-- Скрытые поля для передачи баллов -->
        <input type="hidden" name="score" id="scoreInput" value="0">
        <input type="hidden" name="total" id="totalInput" value="2">

        <button type="submit">Завершить тест</button>
    </form>

    <div id="result"></div>
</div>

<script>
    const correctAnswers = { q1: 'B', q2: 'A' };
    let isSubmitted = false;

    function prepareSubmit(event) {
        const name = document.getElementById('studentName').value.trim();
        const group = document.getElementById('studentGroup').value.trim();

        if (!name || !group) {
            alert('Пожалуйста, укажите ФИО и группу.');
            event.preventDefault();
            return;
        }

        let score = 0;
        let total = Object.keys(correctAnswers).length;

        for (let q in correctAnswers) {
            const selected = document.querySelector(`input[name="${q}"]:checked`);
            if (selected && selected.value === correctAnswers[q]) {
                score++;
            }
        }

        // Заполняем скрытые поля перед отправкой
        document.getElementById('scoreInput').value = score;
        document.getElementById('totalInput').value = total;

        document.getElementById('result').innerText = `Результат: ${score} из ${total}`;
        isSubmitted = true;
    }
</script>

</body>
</html>
