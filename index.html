<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафедральное тестирование</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 600px; padding: 0 20px; line-height: 1.6; background: #f9f9f9; }
        .card { border: 1px solid #ccc; padding: 25px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); background: #fff; }
        .question { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .question-title { font-weight: bold; }
        .points-badge { background: #eef2f7; color: #0066cc; padding: 2px 8px; border-radius: 4px; font-size: 13px; float: right; }
        .options label { display: block; margin: 10px 0; cursor: pointer; }
        select, input[type="text"] { width: 100%; padding: 10px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0066cc; color: #fff; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #0052a3; }
        .hidden { display: none; }
        #resultContainer { text-align: center; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="pageTitle">Портал тестирования кафедры</h2>

    <!-- Стартовое окно -->
    <div id="startScreen">
        <label>ФИО студента:<br><input type="text" id="studentName" placeholder="Иванов Иван" required></label>
        <label>Учебная группа:<br><input type="text" id="studentGroup" placeholder="ИВТ-101" required></label>
        <label>Выберите дисциплину / тест:<br>
            <select id="testSelect">
                <option value="">Подключение к серверу (ожидание)...</option>
            </select>
        </label>
        <button type="button" onclick="loadTest()">Начать тестирование</button>
    </div>

    <!-- Окно прохождения теста -->
    <div id="testScreen" class="hidden">
        <form id="quizForm" onsubmit="submitQuiz(event)">
            <div id="questionsContainer"></div>
            <button type="submit" id="submitBtn">Завершить и отправить тест</button>
        </form>
    </div>

    <!-- Окно результатов -->
    <div id="resultContainer"></div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwyLKYmw8bTIebRmj55nfU8sqTpVjsassnrl-cFzyqixCZoRCoAb-MLyx3NE-jspHBxDQ/exec';

    let activeTestName = "";
    let currentQuestions = [];

    // JSONP с увеличенным до 25 секунд таймаутом для мобильных сетей
    function jsonp(url, successCallback) {
        const uniqueName = 'cb_' + Math.random().toString(36).substring(2, 9);
        
        const timer = setTimeout(() => {
            cleanup();
            const select = document.getElementById('testSelect');
            if (select && select.value === "") {
                select.innerHTML = '<option value="">Сервер долго отвечает. Обновите страницу.</option>';
            }
        }, 25000); // 25 секунд для мобильного интернета

        window[uniqueName] = function(data) {
            clearTimeout(timer);
            cleanup();
            successCallback(data);
        };

        const script = document.createElement('script');
        script.id = uniqueName;
        script.src = `${url}&callback=${uniqueName}`;
        script.onerror = function() {
            clearTimeout(timer);
            cleanup();
            const select = document.getElementById('testSelect');
            if (select) select.innerHTML = '<option value="">Ошибка соединения с сервером</option>';
        };
        document.body.appendChild(script);

        function cleanup() {
            if (window[uniqueName]) delete window[uniqueName];
            const el = document.getElementById(uniqueName);
            if (el) el.remove();
        }
    }

    // Загрузка списка тестов при открытии страницы
    window.onload = function() {
        jsonp(`${WEB_APP_URL}?action=getTestsList`, function(tests) {
            const select = document.getElementById('testSelect');
            if (!tests || tests.length === 0) {
                select.innerHTML = '<option value="">Нет доступных тестов в таблице</option>';
                return;
            }
            select.innerHTML = '<option value="">-- Выберите тест --</option>';
            tests.forEach(testName => {
                let opt = document.createElement('option');
                opt.value = testName;
                opt.textContent = testName;
                select.appendChild(opt);
            });
        });
    };

    // Загрузка вопросов выбранного теста
    function loadTest() {
        const name = document.getElementById('studentName').value.trim();
        const group = document.getElementById('studentGroup').value.trim();
        activeTestName = document.getElementById('testSelect').value;

        if (!name || !group || !activeTestName) {
            alert('Пожалуйста, заполните ФИО, группу и выберите тест.');
            return;
        }

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('pageTitle').textContent = activeTestName;
        document.getElementById('questionsContainer').innerHTML = '<p>Загрузка вопросов...</p>';
        document.getElementById('testScreen').classList.remove('hidden');

        jsonp(`${WEB_APP_URL}?action=getQuestions&testName=${encodeURIComponent(activeTestName)}`, function(questions) {
            currentQuestions = questions;
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            if (!questions || questions.length === 0) {
                container.innerHTML = '<p>В этом тесте пока нет вопросов.</p>';
                document.getElementById('submitBtn').style.display = 'none';
                return;
            }

            questions.forEach((q, index) => {
                let qDiv = document.createElement('div');
                qDiv.className = 'question';
                
                let html = `
                    <p class="question-title">
                        <span>${index + 1}. ${q.text}</span>
                        <span class="points-badge">Баллов: ${q.points}</span>
                    </p>
                    <div class="options">
                `;
                for (let optKey in q.options) {
                    html += `<label><input type="radio" name="${q.id}" value="${optKey}" required> <b>${optKey})</b> ${q.options[optKey]}</label>`;
                }
                html += `</div>`;
                qDiv.innerHTML = html;
                container.appendChild(qDiv);
            });
        });
    }

    // Отправка ответов
    function submitQuiz(event) {
        event.preventDefault();

        const name = document.getElementById('studentName').value.trim();
        const group = document.getElementById('studentGroup').value.trim();

        // Упаковываем ответы в компактный объект
        const answersObj = {};
        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="${q.id}"]:checked`);
            if (selected) {
                answersObj[q.id] = selected.value;
            }
        });

        // Формируем параметры запроса
        const params = new URLSearchParams();
        params.append('action', 'submit');
        params.append('testName', activeTestName);
        params.append('name', name);
        params.append('group', group);
        params.append('answers', JSON.stringify(answersObj));

        document.getElementById('questionsContainer').innerHTML = '<p>Отправка результатов на сервер...</p>';
        document.getElementById('submitBtn').style.display = 'none';

        // Отправляем через ту же функцию jsonp, чтобы сервер корректно принял данные
        jsonp(`${WEB_APP_URL}?${params.toString()}`, function(res) {
            document.getElementById('testScreen').classList.add('hidden');
            document.getElementById('resultContainer').innerHTML = `
                <h3>Спасибо, ${name}!</h3>
                <p>Ваши результаты по тесту <b>«${activeTestName}»</b> успешно записаны в ведомость.</p>
            `;
        });
    }
</script>

</body>
</html>
