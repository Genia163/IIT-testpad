<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-тестирование</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 600px; padding: 0 20px; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .question { margin-bottom: 20px; }
        .options label { display: block; margin: 8px 0; cursor: pointer; }
        button { background: #0066cc; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0052a3; }
        #result { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Тест по дисциплине</h2>
    
    <div id="userInfo">
        <label>ФИО студента:<br><input type="text" id="studentName" required style="width: 100%; padding: 8px; margin: 10px 0;"></label>
        <label>Группа:<br><input type="text" id="studentGroup" required style="width: 100%; padding: 8px; margin: 10px 0;"></label>
    </div>

    <form id="quizForm">
        <div class="question">
            <p><b>1. Какой язык программирования используется для веб-разработки на клиенте?</b></p>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> C++</label>
                <label><input type="radio" name="q1" value="B"> JavaScript</label>
                <label><input type="radio" name="q1" value="C"> Python</label>
            </div>
        </div>

        <div class="question">
            <p><b>2. Что обозначает аббревиатура HTML?</b></p>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> HyperText Markup Language</label>
                <label><input type="radio" name="q2" value="B"> High Tech Modern Language</label>
            </div>
        </div>

        <button type="button" onclick="submitQuiz()">Завершить тест</button>
    </form>

    <div id="result"></div>
</div>

<script>
    // Правильные ответы
    const correctAnswers = { q1: 'B', q2: 'A' };

    function submitQuiz() {
        const name = document.getElementById('studentName').value.trim();
        const group = document.getElementById('studentGroup').value.trim();

        if (!name || !group) {
            alert('Пожалуйста, укажите ФИО и группу.');
            return;
        }

        let score = 0;
        let total = Object.keys(correctAnswers).length;

        for (let q in correctAnswers) {
            const selected = document.querySelector(`input[name="${q}"]:checked`);
            if (selected && selected.value === correctAnswers[q]) {
                score++;
            }
        }

        document.getElementById('result').innerText = `Результат: ${score} из ${total}`;

        // Отправка результатов (опционально - через Webhook / Telegram / Google Script)
        sendResults(name, group, score, total);
    }

    function sendResults(name, group, score, total) {
    // Вставьте сюда URL, который вы скопировали из Google Apps Script
    const WEB_APP_URL = 'ВАШ_URL_ВЕБ_ПРИЛОЖЕНИЯ_GOOGLE';

    const data = {
        name: name,
        group: group,
        score: score,
        total: total
    };

    fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors', // Важно для обхода блокировок CORS при запросе к Google Скриптам
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(() => {
        alert('Тест успешно отправлен преподавателю!');
    })
    .catch((error) => {
        console.error('Ошибка отправки:', error);
        alert('Произошла ошибка при отправке результатов.');
    });
}
</script>

</body>
</html>
